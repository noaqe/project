name: Java and PostgreSQL checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: library_test
          POSTGRES_USER: library_test
          POSTGRES_PASSWORD: ci_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U library_test -d library_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/library_test
      TEST_DB_USER: library_test
      TEST_DB_PASSWORD: ci_local_password
      TEST_DB_RESET: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build, unit and integration tests
        run: bash mvnw -B -ntp -Pintegration verify
